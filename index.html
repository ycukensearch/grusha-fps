<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Груша FPS </title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #05080e;
            font-family: 'Segoe UI', system-ui, sans-serif;
            touch-action: none;
        }
        #info {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            color: #b0d0ff;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 14px 20px;
            border-radius: 20px;
            border: 1px solid #2a4a6a;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 1px 4px black;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #info span {
            color: #f0e68c;
            font-weight: 800;
            font-size: 20px;
            margin-left: 6px;
        }
        #status {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #e0e8ff;
            background: rgba(10, 20, 30, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 16px 30px;
            border-radius: 50px;
            border: 1px solid #4a6a9a;
            font-size: 16px;
            text-align: center;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            pointer-events: none;
            width: 80%;
            max-width: 400px;
            line-height: 1.5;
            transition: all 0.3s ease;
        }
        #status strong {
            color: #ffd966;
            font-size: 22px;
            display: block;
            margin-top: 6px;
        }
        .btn {
            position: absolute;
            bottom: 40px;
            right: 20px;
            background: linear-gradient(180deg, #2a405a, #142130);
            border: 2px solid #4a6a8a;
            color: #dfeaff;
            font-weight: bold;
            font-size: 15px;
            padding: 14px 24px;
            border-radius: 50px;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 6px 0 #05080e;
            letter-spacing: 1px;
            transition: all 0.1s;
            display: none;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #05080e;
        }
    </style>
</head>
<body>
    <div id="info">
        <div>🍐 Груша FPS</div>
        <div>⚡ Бесплатный тест производительности вашего устройства<br> 
            без танцев с бубном!<br>
        <a href="test.html">Начать!</a> / <a href="https://openvk.org/app758">Открыть в OpenVK</a></div>
    </div>
    
</body>
  </html>
